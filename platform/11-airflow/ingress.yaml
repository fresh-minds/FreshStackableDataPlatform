# Ingress voor Airflow webserver onder platform.uwv-platform.local/airflow.
# Same-origin met de portal embed-shell (/embed/airflow).
#
# X-Forwarded-Prefix wordt door FAB gelezen (PROXY_FIX_X_PREFIX=1 in
# airflowcluster.yaml) om redirect_uri's correct op te bouwen.
# X-Forwarded-Port=8443 zit erbij omdat de browser :8443 ziet, maar
# de ingress intern naar :80/:443 forwarded — zonder dit zou Flask
# de poort uit Host wegrekenen en OAuth redirect_uri zou ontbreken.
#
# Service uwv-airflow-webserver bestaat al via Stackable-operator
# (ClusterIP op 8080).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow
  namespace: uwv-platform
  annotations:
    cert-manager.io/cluster-issuer: uwv-platform-issuer
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Prefix /airflow;
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["platform.uwv-platform.local"]
      secretName: airflow-platform-tls
  rules:
    - host: platform.uwv-platform.local
      http:
        paths:
          - path: /airflow
            pathType: Prefix
            backend:
              service:
                name: uwv-airflow-webserver
                port:
                  number: 8080
