# Custom webserver_config.py voor Airflow 3.0.6.
#
# Waarom: Stackable Airflow 26.3 genereert een minimale webserver_config.py
# zonder role-mapping. `configOverrides.webserver_config.py` op de
# AirflowCluster CRD wordt geaccepteerd maar door de operator NIET
# meegerendered (zie kubectl get cm uwv-airflow-webserver-default
# -o jsonpath='{.data.webserver_config\.py}' — onze keys ontbreken).
#
# Bovendien definieert Stackable géén custom get_oauth_user_info() →
# FAB's default leest het Keycloak `roles` userinfo-claim niet als
# role_keys, dus AUTH_ROLES_MAPPING zou alsnog leeg blijven.
#
# Airflow 3.x: de security-manager is verhuisd naar het FAB-provider
# (apache-airflow-providers-fab); we erven van
# FabAirflowSecurityManagerOverride i.p.v. de oude
# airflow.www.security.AirflowSecurityManager (die bestaat niet meer).
# Setting heet nu FAB_SECURITY_MANAGER_CLASS — een string-pad naar de
# class, niet de class zelf.
#
# Oplossing: we mounten deze ConfigMap via subPath bovenop
# /stackable/app/config/webserver_config.py (zie airflowcluster.yaml
# webservers.roleGroups.default.podOverrides). Houd OAUTH_PROVIDERS
# in sync met wat de operator zou genereren — dump na een operator-
# upgrade `cat /stackable/app/config/..data/webserver_config.py` in
# een verse pod om diff te checken.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-webserver-config
  namespace: uwv-platform
data:
  webserver_config.py: |
    """UWV-override van Stackable's gegenereerde webserver_config.py.

    Voegt toe:
      - AUTH_ROLES_MAPPING — Keycloak realm-roles → FAB-rollen
      - AUTH_ROLES_SYNC_AT_LOGIN — re-sync bij elke login
      - UWVAirflowSecurityManager — leest `roles` claim uit userinfo
        en geeft die door als role_keys (FAB's default doet dat niet
        voor de keycloak-provider).
    """
    import os

    from airflow.providers.fab.auth_manager.security_manager.override import (
        FabAirflowSecurityManagerOverride,
    )
    from flask_appbuilder.const import AUTH_OAUTH

    basedir = os.path.abspath(os.path.dirname(__file__))
    WTF_CSRF_ENABLED = True

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    # Public = geen Airflow-rechten; non-platform users (wia_beoordelaar
    # etc.) landen hier en kunnen de UI niet gebruiken.
    AUTH_USER_REGISTRATION_ROLE = "Public"
    AUTH_ROLES_SYNC_AT_LOGIN = True

    # Keycloak realm-role → FAB-rol. Onbekende rollen vallen terug op
    # AUTH_USER_REGISTRATION_ROLE (= Public, geen toegang).
    AUTH_ROLES_MAPPING = {
        "platform_admin": ["Admin"],
        "data_engineer": ["Op"],
        "data_steward": ["User"],
    }

    # Stackable hashed de AuthenticationClass-config naar deze env-var-
    # namen (bv. OIDC_1F14E77C7AE19424_CLIENT_ID). Dynamisch scannen
    # i.p.v. hardcoden zodat een operator-rerender ons niet breekt.
    _OIDC_CLIENT_ID = next(
        (v for k, v in os.environ.items()
         if k.startswith("OIDC_") and k.endswith("_CLIENT_ID")),
        None,
    )
    _OIDC_CLIENT_SECRET = next(
        (v for k, v in os.environ.items()
         if k.startswith("OIDC_") and k.endswith("_CLIENT_SECRET")),
        None,
    )

    # In-cluster service-DNS naar Keycloak (zie authenticationclass-keycloak.yaml).
    # Browser-redirects gaan via de externe ingress (issuer in token klopt).
    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": _OIDC_CLIENT_ID,
                "client_secret": _OIDC_CLIENT_SECRET,
                "client_kwargs": {"scope": "openid profile email roles"},
                "api_base_url": "http://keycloak.uwv-auth.svc.cluster.local/realms/uwv/protocol/",
                "server_metadata_url": "http://keycloak.uwv-auth.svc.cluster.local/realms/uwv/.well-known/openid-configuration",
            },
        }
    ]


    # ─── Bridge tussen FAB session-cookie en Airflow 3 API JWT ────────
    # Achtergrond: Airflow 3 heeft twee auth-systemen die naast elkaar
    # leven:
    #   1. Flask-AppBuilder (FAB) session-cookie  → /airflow/auth/* UI
    #   2. Airflow API JWT cookie `_token`        → /airflow/ui/* + /api/v2/*
    #
    # De React-SPA op /airflow/ leest /ui/config, /ui/auth/menus, etc. Die
    # endpoints zitten op de FastAPI-app en eisen het `_token` JWT-cookie.
    # MAAR: FAB's stock `oauth_authorized` view (flask_appbuilder/security/
    # views.py:747) doet enkel `login_user(user); return redirect(next)` —
    # er wordt nooit een JWT uitgegeven. Resultaat na een geslaagde
    # Keycloak-OIDC-flow:
    #
    #   /airflow/auth/oauth-authorized/keycloak → 302  (set Flask session)
    #   /airflow/                               → 200  (SPA HTML)
    #   /airflow/ui/config                      → 401  (geen _token!)
    #   /airflow/api/v2/auth/login              → 307  /airflow/auth/login/
    #   /airflow/auth/login/                    → 302  /airflow/auth/   (FAB ziet
    #                                                  geldige session → skipped OIDC)
    #   /airflow/auth/                          → 302  /airflow
    #   /airflow                                → 307  /airflow/        (lus)
    #
    # Chrome breekt af met ERR_TOO_MANY_REDIRECTS — in de portal-iframe
    # gerenderd als "This content is blocked. Contact the site owner to
    # fix the issue." Dit is een upstream Airflow 3 + FAB-OAuth bug; tot
    # die gefixt is, vullen we het gat zelf met een after_request hook
    # die het `_token` cookie zet zodra de Flask-session is ingelogd.
    import sys

    from flask_login import current_user
    from airflow.api_fastapi.app import get_auth_manager
    from airflow.api_fastapi.auth.managers.base_auth_manager import (
        COOKIE_NAME_JWT_TOKEN,
    )


    def _issue_airflow_jwt_cookie(response):
        """Set `_token` JWT-cookie wanneer Flask-Login een user heeft.

        Vuurt op IEDERE Flask-response (dus alleen op /airflow/auth/* en
        andere FAB-UI-paden — de FastAPI-routes /ui/* en /api/v2/* gaan
        niet via Flask).

        Implementatiedetail: we lezen `current_user` uit Flask-Login,
        NIET `g.user`. FAB zet `g.user = current_user` in een
        before_request-handler — vóór de view-functie draait. Wanneer
        `oauth_authorized` daarna `login_user(new_user)` aanroept, wordt
        `_request_ctx_stack.top.user` ge-update (en daarmee
        `current_user`) maar `g.user` blijft de PRE-login anonymous user.
        Een hook die `g.user.is_authenticated` checkt mist daardoor net
        het login-moment — precies het response waar het _token cookie
        gezet moet worden. `current_user` reflecteert wel de nieuwe
        login direct.

        Faalt fail-safe: een uitzondering wordt gelogd maar nooit
        gepropageerd — we willen nooit een legitiem login-response
        verzieken door een JWT-generatie-fout.
        """
        try:
            if not current_user or not current_user.is_authenticated:
                return response
            user = current_user._get_current_object()
            # generate_jwt gebruikt default [api_auth] jwt_expiration_time
            # = 86400. Cookie-max_age = JWT-TTL, zodat de cookie tegelijk
            # met de JWT verdwijnt en de FAB-session de volgende keer
            # OIDC opnieuw triggert i.p.v. te loopen.
            jwt_token = get_auth_manager().generate_jwt(user=user)
            # NB: httponly=False is bewust. Airflow 3's React-SPA leest
            # het `_token` cookie via `document.cookie` en zet 'm vervolgens
            # als `Authorization: Bearer …`-header op iedere XHR — een
            # HttpOnly cookie is onzichtbaar voor JS, en /ui/config blijft
            # dan 401-en. Dit is dezelfde keuze als Airflow's simple-auth
            # SPA (zie auth/managers/simple/ui/src/login/Login.tsx, dat
            # `useCookies(["_token"])` van react-cookie gebruikt — eveneens
            # zonder HttpOnly). De XSS-mitigatie loopt via FAB's
            # WTF_CSRF_ENABLED + scoped CSP, niet via HttpOnly.
            response.set_cookie(
                COOKIE_NAME_JWT_TOKEN,
                jwt_token,
                max_age=86400,
                httponly=False,
                secure=True,
                samesite="Lax",
                path="/",
            )
            # Eenmalige debug-log per response — laat in de Airflow-pod-
            # logs zien dat de hook daadwerkelijk het cookie heeft gezet.
            # Mag later weg zodra de fix stabiel is.
            print(
                f"uwv-webserver-config: _token cookie set for "
                f"user={getattr(user, 'username', '?')}",
                file=sys.stderr,
                flush=True,
            )
        except Exception as exc:  # noqa: BLE001 — fail-safe
            print(
                f"uwv-webserver-config: _token cookie sync failed: {exc!r}",
                file=sys.stderr,
                flush=True,
            )
        return response


    class UWVAirflowSecurityManager(FabAirflowSecurityManagerOverride):
        """Leest Keycloak's `roles` userinfo-claim als FAB role_keys.

        FAB's default get_oauth_user_info kent voor de keycloak-provider
        géén role-mapping. Zonder deze override blijft role_keys leeg en
        valt elke user terug op AUTH_USER_REGISTRATION_ROLE = Public.

        Daarnaast registreren we hier de _issue_airflow_jwt_cookie
        after_request-hook (zie comment boven die functie). __init__ is
        de meest betrouwbare hook-aanhakingsplek: de FabAuthManager
        instantieert de security-manager met `appbuilder` als arg zodra
        de Flask-app klaar is, dus appbuilder.app bestaat dan.
        """

        def __init__(self, appbuilder):
            super().__init__(appbuilder)
            appbuilder.app.after_request(_issue_airflow_jwt_cookie)
            print(
                "uwv-webserver-config: _token JWT cookie sync hook registered",
                file=sys.stderr,
                flush=True,
            )

        def get_oauth_user_info(self, provider, resp):
            if provider != "keycloak":
                return super().get_oauth_user_info(provider, resp)
            me = self.appbuilder.sm.oauth_remotes[provider].userinfo()
            return {
                "username": me.get("preferred_username"),
                "email": me.get("email"),
                "first_name": me.get("given_name", ""),
                "last_name": me.get("family_name", ""),
                "role_keys": me.get("roles", []),
            }


    # Airflow 3.x / providers-fab 2.x: FabAuthManager.security_manager
    # leest Flask-config key `SECURITY_MANAGER_CLASS` (NIET het oude
    # `FAB_SECURITY_MANAGER_CLASS`) en verwacht een class-referentie
    # (geen import-pad-string). Zie:
    # airflow/providers/fab/auth_manager/fab_auth_manager.py:
    #   sm_from_config = self.appbuilder.get_app.config.get(
    #     "SECURITY_MANAGER_CLASS")
    #   if not issubclass(sm_from_config, FabAirflowSecurityManagerOverride):
    #     raise AirflowConfigException(...)
    # Verkeerde key of een string betekent: FAB valt terug op de
    # default, onze UWV-override draait niet, role_keys blijft leeg,
    # AUTH_ROLES_MAPPING doet niks, elke OAuth-user landt op Public.
    # Resultaat: 403 op /ui/dashboard/dag_stats etc.
    SECURITY_MANAGER_CLASS = UWVAirflowSecurityManager
