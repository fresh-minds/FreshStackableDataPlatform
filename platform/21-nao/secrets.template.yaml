# TEMPLATE — these Secrets must exist in the cluster but are NOT applied
# via kustomize. The repo `.gitignore` excludes `*-secret.yaml`, so we name
# the file `secrets.template.yaml` to keep this scaffold under version
# control without leaking real values.
#
# Apply real values out-of-band:
#
#   PG_PW=$(openssl rand -hex 24)
#
#   # 1. Postgres password (nao state: auth, chat history, provider config)
#   kubectl -n uwv-platform create secret generic nao-postgres \
#     --from-literal=POSTGRES_PASSWORD="$PG_PW" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # 2. App secrets. Reuse the platform's Azure AI Foundry key (same one
#   #    19-nanitics-observatory uses) so nao's LLM provider is preconfigured:
#   AZURE_KEY=$(kubectl -n uwv-platform get secret nanitics-azure-foundry \
#     -o jsonpath='{.data.AZURE_AI_FOUNDRY_API_KEY}' | base64 -d)
#   kubectl -n uwv-platform create secret generic nao \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DB_URI="postgres://nao:${PG_PW}@nao-postgres:5432/nao" \
#     --from-literal=AZURE_AI_FOUNDRY_API_KEY="$AZURE_KEY" \
#     --from-literal=AZURE_AI_FOUNDRY_ENDPOINT="https://devfreshmindsaifoundry.services.ai.azure.com/api/projects/proj-default/openai/v1" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # 3. Trino service-account client-secret (must match the `nao-trino`
#   #    Keycloak client in infrastructure/helm/keycloak/realm-uwv.json).
#   #    The init container + refresh sidecar use it to mint the
#   #    client_credentials token whose preferred_username=nao-agent maps to
#   #    the read-only nao_agent OPA role.
#   kubectl -n uwv-platform create secret generic nao-trino \
#     --from-literal=client-secret="uwv-dev-only-CHANGE-ME-nao-trino-secret" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE on the LLM provider: nao OSS has no env-var bootstrap for Azure, so
# after first login the provider must be added once via the admin UI (or the
# project_llm_config row in nao-postgres). For this platform it is set to
# provider=openai + base_url=<Foundry /openai/v1> + model gpt-4o (the openai
# provider calls /v1/chat/completions, which Foundry accepts; the azure
# provider's /responses path is rejected by Foundry, and gpt-5.x-nano needs
# max_completion_tokens). The AZURE_AI_FOUNDRY_* keys above are staged for
# convenience.
#
# Same anti-clobber pattern as 17-multica/secrets.template.yaml.

---
apiVersion: v1
kind: Secret
metadata:
  name: nao-postgres
  namespace: uwv-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: nao
  namespace: uwv-platform
type: Opaque
stringData:
  BETTER_AUTH_SECRET: "REPLACE_ME"
  DB_URI: "postgres://nao:REPLACE_ME@nao-postgres:5432/nao"
  AZURE_AI_FOUNDRY_API_KEY: "REPLACE_ME"
  AZURE_AI_FOUNDRY_ENDPOINT: "https://devfreshmindsaifoundry.services.ai.azure.com/api/projects/proj-default/openai/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: nao-trino
  namespace: uwv-platform
type: Opaque
stringData:
  # Must match clients[clientId=nao-trino].secret in realm-uwv.json
  client-secret: "uwv-dev-only-CHANGE-ME-nao-trino-secret"
