# Single host — alles via de multica-oauth2-proxy Service.
# oauth2-proxy splitst path-based naar backend/frontend (zie
# configmap-oauth2-proxy.yaml `upstreams = [...]`) en gates alleen `/`.
#
# Browser → multica.uwv-platform.local:8443
#   ingress → multica-oauth2-proxy:80 (oauth2-proxy:4180)
#     /                → Keycloak SSO check → multica-frontend (Next.js)
#     /api, /auth, /uploads, /ws, /health, /readyz → multica-backend (skip-auth)
#
# WebSocket-upgrade is OK: oauth2-proxy proxiet WS-traffic transparant.
# Generous read-timeout zodat SSE / WS streams open blijven.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multica
  namespace: uwv-platform
  annotations:
    cert-manager.io/cluster-issuer: uwv-platform-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Iframe-allow voor de portal embed-shell (cross-origin). Strip
    # X-Frame-Options EN Multica's eigen Content-Security-Policy — die
    # bevat `frame-ancestors 'none'`; bij meerdere CSP-headers past de
    # browser de intersectie per directive toe en zou 'none' onze
    # permissive header vetoën. We verliezen daarmee Multica's XSS-CSP
    # (script-src/style-src/etc.); voor dev-demo acceptabel — productie
    # zou Multica's CSP configurable moeten maken.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header Content-Security-Policy "frame-ancestors 'self' https://platform.uwv-platform.local:8443 https://platform.eu-sovereigndataplatform.com https://platform.freshstackable.com" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["multica.uwv-platform.local"]
      secretName: multica-tls
  rules:
    - host: multica.uwv-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multica-oauth2-proxy
                port:
                  number: 80
