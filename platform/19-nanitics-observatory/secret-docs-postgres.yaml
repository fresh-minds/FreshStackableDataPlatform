# TEMPLATE ONLY — NOT a kustomize resource.
#
# Documents the shape of the doc-rag pgvector Postgres password. Deliberately
# omitted from kustomization.yaml so `kubectl apply -k .` can't overwrite the
# real password with this placeholder. The SAME secret is consumed by:
#   - postgres-docs.yaml   (POSTGRES_PASSWORD for the DB)
#   - deployment.yaml      (DOCS_PG_PASSWORD for the observatory pod)
#   - job-docs-indexer.yaml (DOCS_PG_PASSWORD for the indexer)
#
# Provision out-of-band:
#
#   kubectl -n uwv-platform create secret generic nanitics-docs-postgres \
#     --from-literal=DOCS_PG_PASSWORD="$(openssl rand -hex 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Production: External Secrets / Vault. Never commit a real password.
apiVersion: v1
kind: Secret
metadata:
  name: nanitics-docs-postgres
  namespace: uwv-platform
  labels:
    uwv.nl/dev-only: "true"
type: Opaque
stringData:
  DOCS_PG_PASSWORD: "CHANGE-ME-dev-only-docrag-password"
