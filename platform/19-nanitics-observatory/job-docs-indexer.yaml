# One-shot indexer for the doc-rag agent's pgvector store.
#
# Chunks the docs corpus baked into the image (/srv/docs-bundle), embeds each
# chunk via the Foundry /embeddings endpoint, and (re)loads the doc_chunks
# table in nanitics-docs-postgres. Run it AFTER deploying postgres-docs.yaml
# and rebuilding the image, and again whenever the docs change.
#
# NOT in kustomization.yaml — a Job's pod template is immutable, so re-running
# means replacing it. Run with:
#
#   kubectl -n uwv-platform delete job nanitics-docs-indexer --ignore-not-found
#   kubectl -n uwv-platform apply -f job-docs-indexer.yaml
#   kubectl -n uwv-platform logs -f job/nanitics-docs-indexer
#
# (Or one-shot without a manifest:
#   kubectl -n uwv-platform create job nanitics-docs-reindex-$(date +%s) \
#     --image=uwv-platform/nanitics-observatory:dev -- python /srv/docs_index.py
#  — but that won't pick up the envFrom; the manifest below is preferred.)
apiVersion: batch/v1
kind: Job
metadata:
  name: nanitics-docs-indexer
  namespace: uwv-platform
  labels:
    app.kubernetes.io/part-of: uwv-platform
    app.kubernetes.io/component: nanitics-observatory
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanitics-docs-indexer
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: uwv-platform/nanitics-observatory:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "/srv/docs_index.py"]
          envFrom:
            - configMapRef:
                name: nanitics-observatory-config
            # Embedding calls reuse the Foundry key.
            - secretRef:
                name: nanitics-azure-foundry
            # pgvector Postgres password (DOCS_PG_PASSWORD).
            - secretRef:
                name: nanitics-docs-postgres
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
