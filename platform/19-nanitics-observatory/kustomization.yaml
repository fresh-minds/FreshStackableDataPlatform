apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uwv-platform

resources:
  - configmap.yaml
  # NOTE: secret.yaml is intentionally NOT in this list. Kustomize-applying
  # it would overwrite the real key with the placeholder. Same rationale
  # for secret-multica.yaml and secret-opensearch.yaml — kustomize only
  # owns config that's safe to round-trip from disk.
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob-watcher.yaml
  - cronjobs-observers.yaml
  # doc-rag pgvector store. The indexer (job-docs-indexer.yaml) and the
  # password Secret (secret-docs-postgres.yaml) are applied out-of-band —
  # a Job's pod template is immutable and Secrets must not be clobbered.
  - postgres-docs.yaml

commonLabels:
  app.kubernetes.io/part-of: uwv-platform
  app.kubernetes.io/component: nanitics-observatory
