# Ingress voor Prometheus UI (op poort 9090) onder
# platform.uwv-platform.local/prometheus. Same-origin met portal-shell.
# Prometheus zelf is met --web.route-prefix=/prometheus geconfigureerd
# (zie prometheusSpec.routePrefix in infrastructure/helm/prometheus-stack/
# values.yaml), dus geen rewrite-target nodig — het pad wordt onverkort
# doorgegeven.
#
# Service prometheus-kube-prometheus-prometheus wordt door kube-prometheus-stack
# gemaakt. Geen auth — voor demo/dev OK; productie zou oauth2-proxy ervoor zetten.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: uwv-monitoring
  annotations:
    cert-manager.io/cluster-issuer: uwv-platform-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["platform.uwv-platform.local"]
      secretName: prometheus-platform-tls
  rules:
    - host: platform.uwv-platform.local
      http:
        paths:
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus-kube-prometheus-prometheus
                port:
                  number: 9090
