# Service + Ingress voor Spark UI via SparkHistoryServer.
#
# Vóór: eigen Service selecteerde `spark-app-name=streaming-bronze,
# spark-role=driver` → bereik baar zolang die driver draait. Batch-jobs leven
# seconden tot minuten dus geeft de ingress meestal 503.
#
# Nu: route naar de SparkHistoryServer (zie history-server.yaml). Die leest
# event-logs uit s3a://uwv-checkpoints/spark-events/ en serveert UI op 18080.
# Permanent beschikbaar, toont alle historische én actieve runs.
#
# Wat krijg je op https://spark.uwv-platform.local:8443/ ?
#   - Lijst van completed applications (silver-wia-*, gold-wia-*, seed-bronze-wia)
#   - Per app: Jobs/Stages/Tasks/SQL/Environment tabs zoals een live UI
#   - Geen SSO — Spark UI heeft geen native auth. Acceptabel voor dev/k3d.
---
apiVersion: v1
kind: Service
metadata:
  name: spark
  namespace: uwv-platform
spec:
  type: ClusterIP
  selector:
    # Stackable SparkHistoryServer pod-labels (rolegroup `default` zoals
    # gedefinieerd in history-server.yaml). app.kubernetes.io/name is
    # `spark-history` (NIET `spark-k8s` zoals bij SparkApplication driver pods).
    app.kubernetes.io/name: spark-history
    app.kubernetes.io/instance: history
    app.kubernetes.io/component: node
  ports:
    - name: http
      port: 18080
      targetPort: 18080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spark
  namespace: uwv-platform
  annotations:
    cert-manager.io/cluster-issuer: uwv-platform-issuer
    # Iframe-allow voor portal embed-shell (cross-origin).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      add_header Content-Security-Policy "frame-ancestors 'self' https://platform.uwv-platform.local:8443 https://platform.eu-sovereigndataplatform.com https://platform.freshstackable.com" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["spark.uwv-platform.local"]
      secretName: spark-tls
  rules:
    - host: spark.uwv-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spark
                port:
                  number: 18080
