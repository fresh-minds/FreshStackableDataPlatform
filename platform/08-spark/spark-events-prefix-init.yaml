# One-shot Job: maak s3a://uwv-checkpoints/spark-events/.keep aan zodat
# SparkHistoryServer kan starten (anders FsHistoryProvider crasht met
# "Log directory specified does not exist").
#
# S3 heeft geen echt directory-concept; Hadoop S3A interpreteert een
# leeg prefix als "bestaat niet". Eén placeholder-object volstaat.
#
# Backend-agnostisch: gebruikt amazon/aws-cli (geen mc) zodat de Job
# werkt tegen zowel MinIO (aks/stackit) als SeaweedFS (k3d). De S3
# endpoint URL en het CA-bundle komen uit env-vars + de
# `minio-ca-bundle` Secret die bootstrap.sh per mode populeert.
#
# Idempotent: s3api put-object overschrijft .keep zonder error.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-events-prefix-init
  namespace: uwv-platform
  labels:
    uwv.nl/component: spark-history
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.17.36
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-s3-credentials
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-s3-credentials
                  key: secretKey
            - name: AWS_DEFAULT_REGION
              value: "eu-nl-1"
            # Endpoint URL is mode-afhankelijk; bootstrap.sh schrijft 'm in
            # de ConfigMap `s3-endpoint-config` (Phase 2 van ADR-0011) zodat
            # deze Job en andere consumers één bron van waarheid hebben.
            # Fallback default = SeaweedFS (k3d) endpoint.
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: s3-endpoint-config
                  key: endpoint
                  optional: true
            # CA-bundle voor TLS-verification van de self-signed S3-endpoint.
            # Stackable secret-operator levert `minio-ca-bundle` als file-mount
            # niet beschikbaar in een one-shot Job — we mounten 'm direct.
            - name: AWS_CA_BUNDLE
              value: /etc/s3-ca/ca.crt
          volumeMounts:
            - name: s3-ca
              mountPath: /etc/s3-ca
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -e
              # Default endpoint als de ConfigMap ontbreekt (k3d-bootstrap-tijd).
              ENDPOINT="${AWS_ENDPOINT_URL:-https://seaweedfs-s3.uwv-platform.svc.cluster.local:8443}"
              echo "Using S3 endpoint: ${ENDPOINT}"
              echo "spark-events directory marker (created by spark-events-prefix-init Job)" > /tmp/.keep
              aws --endpoint-url "${ENDPOINT}" s3api put-object \
                --bucket uwv-checkpoints \
                --key spark-events/.keep \
                --body /tmp/.keep
              echo "OK: spark-events/.keep aanwezig"
      volumes:
        - name: s3-ca
          secret:
            secretName: minio-ca-bundle
            items:
              - key: ca.crt
                path: ca.crt
