# Service + Ingress voor Superset.
# Stackable maakt alleen headless Services; voor browser-toegang is een
# normale ClusterIP Service + nginx-ingress nodig.
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: uwv-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: superset
    app.kubernetes.io/instance: uwv-superset
  ports:
    - name: http
      port: 8088
      targetPort: 8088
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superset
  namespace: uwv-platform
  annotations:
    cert-manager.io/cluster-issuer: uwv-platform-issuer
    # Superset (Flask-AppBuilder) verwacht z'n routes op de root van de
    # WSGI-app — Werkzeug's ProxyFix zet wel SCRIPT_NAME uit X-Forwarded-Prefix
    # maar strip't PATH_INFO niet. Daarom moet nginx het /superset-prefix
    # zelf wegrekenen vóór de upstream-call. Met rewrite-target: /$2 en
    # path-regex `/superset(/|$)(.*)` belandt /superset/login als /login bij
    # Flask, terwijl X-Forwarded-Prefix Flask vertelt om /superset voor
    # url_for() te plakken.
    #
    # X-Forwarded-Port=8443 voor OAuth redirect_uri (k3d host:8443 →
    # cluster:443); zonder die header zou Superset z'n eigen URL bouwen
    # zonder :8443 → browser landt op port 443 die niet luistert.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Prefix /superset;
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["platform.uwv-platform.local"]
      secretName: superset-platform-tls
  rules:
    - host: platform.uwv-platform.local
      http:
        paths:
          - path: /superset(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: superset
                port:
                  number: 8088
