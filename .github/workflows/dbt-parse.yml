# CI: dbt parse + compile — valideert YAML/Jinja zonder warehouse.
name: dbt-parse

on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'ci/scripts/check-dbt-*.py'
      - '.github/workflows/dbt-parse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'ci/scripts/check-dbt-*.py'
      - '.github/workflows/dbt-parse.yml'
  workflow_dispatch:

jobs:
  dbt-parse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-trino
        run: pip install --quiet 'dbt-core>=1.10' 'dbt-trino>=1.9'

      - name: dbt deps
        working-directory: dbt
        run: |
          cp profiles.yml.template profiles.yml
          DBT_PROFILES_DIR=. dbt deps

      - name: dbt parse
        working-directory: dbt
        run: |
          DBT_PROFILES_DIR=. \
          TRINO_PASSWORD=ci-dummy \
          dbt parse

      - name: Install yaml dep for ci-checks
        run: pip install --quiet pyyaml

      - name: "dbt meta-block-completeness check (improvements #11)"
        run: python ci/scripts/check-dbt-meta.py

      - name: dbt mart-tests presence check
        run: python ci/scripts/check-dbt-tests.py

      - name: platform-config drift check
        # Per ADR-0010: the YAML at repo-root and the ConfigMap mirror in
        # platform/00-namespaces/ must agree on every documented key.
        run: python ci/scripts/check-platform-config-sync.py
