# CI: Trivy vulnerability + SBOM scan (R-BIO-15, R-NIS2-03).
# Scant manifests + container-images die in release.yaml + helm-values staan.
#
# Triggers:
#   - on push to main / pull_request → continuous baseline scan (HIGH+CRITICAL)
#   - nightly schedule → catches newly-disclosed CVEs in dependencies we
#     haven't touched
#   - workflow_dispatch → ad-hoc reruns
name: security-scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # for codeql sarif upload

jobs:
  trivy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config-scan (kustomize/helm) — SARIF upload
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          format: 'sarif'
          output: 'trivy-config.sarif'
          # Non-blocking: report HIGH+CRITICAL findings as code-scan alerts
          # in the Security tab, but don't fail the build until the existing
          # backlog is swept. Flip to '1' once the baseline is clean.
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy config-scan (kustomize/helm) — summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

  trivy-fs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem-scan (Python deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  cosign-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Verify Stackable images (sample)
        run: |
          # Stackable signs all production images. Verify a sample.
          cosign verify \
            --certificate-identity-regexp 'https://github.com/stackabletech/.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            docker.stackable.tech/stackable/trino:470-stackable26.3.0 \
          || echo "(cosign-verify: out-of-band; geen blocking — referentie-only)"
