# CI: lint — yamllint, ruff, opa fmt --diff. Snel + zonder cluster.
name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet yamllint
      - run: yamllint -c ci/yamllint.yaml platform/ infrastructure/ ci/

  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet ruff
      - run: ruff check data-generation/ spark-jobs/

  opa-fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/v0.69.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - run: opa fmt --diff opa-policies-src/trino/

  bash-shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (best-effort)
        # `-S error` houdt info/warning/style-checks zichtbaar in de log maar
        # laat ze de build niet falen. Past bij "pragmatisch dev-niveau" uit
        # ci/yamllint.yaml — focus op echte bugs, niet op stijl/style-nits.
        run: |
          shellcheck --version
          find scripts/ tests/smoke/ tests/e2e/ -name '*.sh' \
            -exec shellcheck -e SC1091,SC2086 -S error {} +

  portal-typecheck:
    # Astro + TypeScript: `astro check` valideert .astro componenten en .ts
    # bestanden tegen het project tsconfig + content-collections schema.
    # Catched type-fouten zonder dat we de portal hoeven te builden.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "portal/package-lock.json"
      - name: Install portal deps
        working-directory: portal
        run: npm ci --no-audit --no-fund
      - name: Generate Astro types
        working-directory: portal
        # `astro check` needs `.astro/types.d.ts` to be generated first; the
        # `astro sync` command does exactly that (creates the env shim + the
        # types for content collections + integrations).
        run: npx astro sync
      - name: astro check (type + a11y diagnostics)
        working-directory: portal
        run: npm run typecheck
