# Extra egress allow voor SKE CoreDNS (luistert op 8053, niet 53).
# Coexisteert met de base `allow-dns-egress` policy (die wel port 53 toestaat
# voor andere cluster-DNS implementaties — k3d/AKS gebruiken 53 op de pod).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress-stackit-coredns
  namespace: uwv-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 8053
          protocol: UDP
        - port: 8053
          protocol: TCP
---
