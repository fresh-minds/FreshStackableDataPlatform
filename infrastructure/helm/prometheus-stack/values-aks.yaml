# kube-prometheus-stack — AKS-specific overrides.

# Alertmanager AAN in AKS — receivers + email-relay-config komen uit de
# AlertmanagerConfig CR (gepatcht door platform-overlays/aks/14-monitoring/).
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    alertmanagerConfigSelector:
      matchLabels:
        alertmanagerConfig: uwv-platform
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "managed-csi"
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "managed-csi"

grafana:
  persistence:
    storageClassName: "managed-csi"
  # Chart-managed Grafana ingress stays on .uwv-platform.local; public
  # AKS ingress is in infrastructure/azure/public-ingresses.yaml.
  # OIDC endpoints overridden naar publieke AKS domein (Let's Encrypt, geen
  # skip-tls-verify nodig). root_url moet matchen met redirect_uri in realm.
  grafana.ini:
    server:
      root_url: "https://grafana.eu-sovereigndataplatform.com"
    auth.generic_oauth:
      auth_url: "https://keycloak.eu-sovereigndataplatform.com/realms/uwv/protocol/openid-connect/auth"
      token_url: "https://keycloak.eu-sovereigndataplatform.com/realms/uwv/protocol/openid-connect/token"
      api_url: "https://keycloak.eu-sovereigndataplatform.com/realms/uwv/protocol/openid-connect/userinfo"
      tls_skip_verify_insecure: false
